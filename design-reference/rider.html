<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <title>Paira Express — Rider workspace</title>
  <style>
    :root {
      --ink:#182230;--muted:#7b8796;--line:#e9edf2;--canvas:#f5f7fa;--surface:#fff;
      --blue:#3766e8;--blue-soft:#edf2ff;--green:#16845b;--green-soft:#e8f7f0;
      --amber:#b87913;--amber-soft:#fff5df;--red:#c34d4d;--red-soft:#fff0ef;
      --sidebar:244px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased
    }
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--canvas);font-size:14px}
    button,input,select,textarea{font:inherit}button{cursor:pointer}
    .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);padding:22px 15px 16px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
    .brand{display:flex;align-items:center;gap:11px;margin:0 8px 27px}.brand-mark{width:38px;height:38px;border-radius:0;background:transparent;color:#4b4d51;display:grid;place-items:center}
    .brand-mark svg{width:29px;height:29px}.brand-name{color:#4b4d51;font-size:16px;font-weight:750;letter-spacing:-.5px}.brand-name span{color:#fcc118}
    .rider-chip{display:flex;align-items:center;gap:10px;padding:11px;margin-bottom:25px;background:#fafbfd;border:1px solid var(--line);border-radius:10px}
    .avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#dce8fa;color:#385c9d;font-size:13px;font-weight:750;flex:none}
    .rider-info{flex:1;min-width:0}.rider-info strong{display:block;font-size:13px}.rider-info small{display:block;margin-top:3px;color:var(--muted);font-size:12px}
    .online-dot{width:8px;height:8px;border-radius:50%;background:#26a879;box-shadow:0 0 0 3px #e3f6ee}
    .nav-label{margin:0 10px 8px;color:#a0a9b6;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
    .nav-group{margin-bottom:22px}.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 11px;margin:2px 0;border:0;border-radius:8px;background:transparent;color:#667283;text-align:left;font-size:14px;font-weight:550;transition:.15s}
    .nav-item:hover{background:#f7f8fa;color:var(--ink)}.nav-item.active{background:var(--blue-soft);color:var(--blue);font-weight:650}
    .nav-item svg{width:17px;height:17px}.nav-count{margin-left:auto;padding:2px 7px;border-radius:20px;background:#f0f2f5;color:#7f8a98;font-size:13px}.nav-item.active .nav-count{background:#fff;color:var(--blue)}
    .sidebar-bottom{margin-top:auto}.help-card{padding:13px;margin:0 2px 14px;background:#f6f8ff;border:1px solid #e9edff;border-radius:10px}
    .help-card strong{font-size:13px}.help-card p{margin:5px 0 10px;color:var(--muted);font-size:13px;line-height:1.55}
    .help-card button{padding:7px 9px;background:#fff;border:1px solid #e1e7fb;border-radius:6px;color:var(--blue);font-size:13px;font-weight:650}
    .user-profile{display:flex;align-items:center;gap:9px;padding:14px 5px 0;border-top:1px solid var(--line)}
    .profile-meta{flex:1}.profile-meta strong{display:block;font-size:13px}.profile-meta small{color:var(--muted);font-size:12px}
    .main{min-height:100vh;margin-left:var(--sidebar)}.topbar{position:sticky;top:0;z-index:10;height:64px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:#fffffff0;border-bottom:1px solid var(--line)}
    .breadcrumb{color:#98a2af;font-size:13px}.breadcrumb strong{color:#475466;font-weight:600}
    .top-actions{display:flex;align-items:center;gap:10px}.shift-chip{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--green-soft);border-radius:20px;color:var(--green);font-size:13px;font-weight:650}
    .shift-chip i{width:6px;height:6px;background:var(--green);border-radius:50%}.icon-button{position:relative;width:34px;height:34px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:7px;color:#768293}
    .icon-button svg{width:16px;height:16px}.notification-dot{position:absolute;right:6px;top:6px;width:8px;height:8px;background:#ec6b63;border:2px solid #fff;border-radius:50%}
    .mobile-menu{display:none;width:32px;height:32px;place-items:center;background:#fff;border:1px solid var(--line);border-radius:7px;color:#677487}
    .content{max-width:1500px;margin:0 auto;padding:28px 32px 48px}.page-heading{display:flex;justify-content:space-between;gap:14px;margin-bottom:20px}
    .eyebrow{margin:0 0 7px;color:#8b96a4;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
    h1{margin:0;font-size:22px;letter-spacing:-.7px}.subtitle{margin:7px 0 0;color:var(--muted);font-size:13px}
    .heading-actions{display:flex;align-items:center;gap:8px}.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#586577;font-size:13px;font-weight:600;transition:.15s}
    .button:hover{border-color:#cbd5e2;background:#fbfcfe}.button svg{width:14px;height:14px}.button-primary{border-color:var(--blue);background:var(--blue);color:#fff}.button-primary:hover{border-color:#2e58cf;background:#2e58cf}
    .button-danger{border-color:#f2d0cd;color:var(--red);background:#fff}.button-sm{padding:7px 9px;font-size:13px}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:15px}.metric,.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
    .metric{padding:15px 16px;min-height:108px}.metric-head{display:flex;align-items:center;justify-content:space-between;color:#748092;font-size:13px}
    .metric-icon{width:27px;height:27px;display:grid;place-items:center;border-radius:7px;background:#f2f5fb;color:#6078ac}.metric-icon svg{width:15px;height:15px}
    .metric-value{margin-top:9px;font-size:22px;font-weight:690;letter-spacing:-.7px}.metric-foot{display:flex;gap:5px;margin-top:4px;color:#96a0ad;font-size:12px}.trend{color:var(--green);font-weight:650}
    .layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:15px;margin-bottom:15px}
    .panel{padding:17px 18px}.panel-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    font-weight:600}.panel-subtitle{margin:5px 0 0;color:#96a0ad;font-size:13px}
    .route-map{position:relative;height:230px;margin-top:16px;overflow:hidden;border:1px solid #e8edf2;border-radius:8px;background-color:#f3f6f7;background-image:linear-gradient(27deg,transparent 46%,#fff 47%,#fff 49%,transparent 50%),linear-gradient(116deg,transparent 42%,#fff 43%,#fff 45%,transparent 46%),linear-gradient(0deg,transparent 67%,#fff 68%,#fff 70%,transparent 71%),linear-gradient(90deg,transparent 27%,#fff 28%,#fff 30%,transparent 31%)}
    .map-river{position:absolute;top:-27px;left:48%;width:42px;height:310px;transform:rotate(24deg);background:#e4eff8;border:1px solid #d9e8f4;border-radius:50%}
    .map-park{position:absolute;top:22px;right:11%;width:84px;height:55px;border-radius:45%;background:#e4f1e8;transform:rotate(-18deg)}
    .road{position:absolute;height:5px;background:#fff;border:1px solid #e9ecee;transform-origin:left center;border-radius:5px}
    .road.r1{top:59%;left:-3%;width:110%;transform:rotate(-13deg)}.road.r2{top:23%;left:4%;width:88%;transform:rotate(22deg)}
    .road.r3{top:88%;left:18%;width:91%;transform:rotate(-34deg)}.road.r4{top:7%;left:76%;height:120%;transform:rotate(25deg)}
    .route-line{position:absolute;left:15%;top:67%;width:62%;height:54%;border:3px solid transparent;border-top-color:#4e76ed;border-right-color:#4e76ed;border-radius:0 42px 0 0;transform:rotate(-10deg)}
    .map-pin{position:absolute;z-index:2;width:26px;height:26px;display:grid;place-items:center;border:2px solid #fff;border-radius:50% 50% 50% 4px;box-shadow:0 2px 7px #27355025;transform:rotate(-45deg);color:#fff;font-size:12px;font-weight:700}
    .map-pin span{transform:rotate(45deg)}.pin-start{left:13%;top:64%;background:#3766e8}.pin-one{left:39%;top:43%;background:#16845b}.pin-two{left:60%;top:53%;background:#16845b}.pin-three{left:77%;top:24%;background:#b87913}
    .map-label{position:absolute;z-index:3;padding:4px 7px;border:1px solid #e9edf2;border-radius:5px;background:#fff;color:#586577;font-size:12px;box-shadow:0 2px 5px #2735500c}
    .label-start{left:8%;top:78%}.label-stop{left:69%;top:16%}
    .map-controls{position:absolute;right:10px;top:10px;z-index:4;display:flex;flex-direction:column;gap:4px}
    .map-controls button{width:27px;height:27px;border:1px solid var(--line);border-radius:5px;background:#fff;color:#5e6a7b;font-size:14px}
    .map-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:#84909f;font-size:12px}
    .route-legend{display:flex;gap:12px}.legend{display:flex;align-items:center;gap:5px}.legend i{width:7px;height:7px;border-radius:50%;background:var(--blue)}.legend i.green{background:var(--green)}.legend i.amber{background:var(--amber)}
    .queue-list{margin-top:13px}.queue-item{position:relative;display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #f0f2f5}.queue-item:last-child{border-bottom:0}
    .stop-marker{position:relative;z-index:1;flex:none;width:25px;height:25px;display:grid;place-items:center;border:1px solid #dce5ff;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:700}
    .queue-copy{flex:1;min-width:0}.queue-copy strong{display:block;color:#354255;font-size:13px}.queue-copy span{display:block;margin-top:3px;color:#929dac;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .queue-detail{text-align:right}.queue-detail strong{display:block;font-size:12px;font-weight:650}.queue-detail small{display:block;margin-top:4px;color:#9aa3af;font-size:12px}
    .stop-tag{display:inline-block;margin-top:5px;padding:3px 6px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-size:12px}
    .next-stop{padding:12px;margin-top:9px;background:#f8faff;border:1px solid #e8edff;border-radius:8px}
    .next-label{color:#8490a1;font-size:12px}.next-address{margin-top:7px;color:#354255;font-size:13px;font-weight:650}.next-meta{margin-top:4px;color:#8e99a8;font-size:12px}
    .next-actions{display:flex;gap:7px;margin-top:11px}.next-actions .button{flex:1}
    .table-panel{padding:0;overflow:hidden}.table-panel .panel-heading{align-items:center;padding:16px 18px}
    .table-tools{display:flex;gap:7px;align-items:center}.table-search{width:145px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;outline:none}
    .table-search:focus{border-color:#b8c8ff}.table-scroll{overflow-x:auto}
    table{width:100%;border-collapse:collapse;text-align:left}th{padding:10px 15px;border-bottom:1px solid var(--line);background:#fafbfd;color:#94a0ae;font-size:12px;font-weight:600;white-space:nowrap}
    td{padding:11px 15px;border-bottom:1px solid #f0f2f5;color:#596678;font-size:13px;white-space:nowrap}tr:last-child td{border-bottom:0}
    .tracking{color:#354255;font-weight:650}.recipient{color:#445165;font-weight:600}.subcell{display:block;margin-top:3px;color:#9aa3af;font-size:12px}
    .status{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:600}.status-delivered,.status-complete{background:var(--green-soft);color:var(--green)}
    .status-transit,.status-assigned{background:var(--blue-soft);color:#4266ce}.status-pending,.status-issue{background:var(--amber-soft);color:var(--amber)}
    .status-failed{background:var(--red-soft);color:var(--red)}
    .earnings-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f2f5;color:#718092;font-size:13px}
    .earnings-row:last-child{border-bottom:0}.earnings-row strong{color:#354255;font-size:13px}
    .earnings-total{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding:12px;border-radius:7px;background:#f6f8ff;color:#65738a;font-size:13px}
    .earnings-total strong{color:#2e55c6;font-size:14px}.cash-banner{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding:11px;background:#fff9ec;border:1px solid #fbefd5;border-radius:8px}
    .cash-banner span{color:#9b772d;font-size:12px}.cash-banner strong{color:#805d16;font-size:13px}
    .activity{display:flex;gap:9px;padding:9px 0}.activity-icon{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:7px;background:#f0f4ff;color:var(--blue)}
    .activity-icon svg{width:14px;height:14px}.activity-copy{color:#667283;font-size:12px;line-height:1.5}.activity-copy strong{color:#354255;font-weight:650}.activity-copy small{display:block;margin-top:3px;color:#a0a9b5;font-size:12px}
    .empty-state{padding:24px;color:#929eac;text-align:center}.toast{position:fixed;z-index:60;right:22px;bottom:22px;padding:12px 16px;border-radius:8px;background:#1f2b3a;color:#fff;font-size:13px;box-shadow:0 12px 35px #17203330;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s}
    .toast.show{opacity:1;transform:translateY(0)}.modal-backdrop{position:fixed;z-index:50;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#17203366}
    .modal-backdrop.open{display:flex}.modal{width:100%;max-width:440px;padding:22px;border-radius:12px;background:#fff;box-shadow:0 24px 70px #10182840}
    .modal-head{display:flex;justify-content:space-between;gap:14px;margin-bottom:16px}.modal-head h2{margin:0;font-size:16px}.modal-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .modal-close{border:0;background:transparent;color:#929dac;font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{color:#637083;font-size:13px;font-weight:600}
    .field input,.field select,.field textarea{padding:9px 10px;border:1px solid #e4e8ee;border-radius:6px;color:#3c4859;font-size:13px;outline:none}.field textarea{min-height:68px;resize:vertical}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:#aebfff}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    @media(max-width:1050px){:root{--sidebar:220px}.content{padding-left:22px;padding-right:22px}.topbar{padding:0 22px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr)}}
    @media(max-width:760px){.sidebar{width:250px;transform:translateX(-105%);transition:transform .2s;box-shadow:12px 0 30px #17203312}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile-menu{display:grid;margin-right:10px}.topbar{justify-content:flex-start;padding:0 15px}.top-actions{margin-left:auto}.content{padding:21px 15px 35px}.layout{grid-template-columns:1fr}.page-heading{align-items:flex-start}}
    @media(max-width:500px){.topbar{height:58px}.shift-chip{font-size:12px;padding:6px 8px}.content{padding-top:18px}.page-heading{flex-direction:column}.heading-actions{width:100%}.metrics{gap:8px}.metric{min-height:100px;padding:11px}.metric-value{font-size:19px}.panel{padding:13px}.table-panel{padding:0}.table-panel .panel-heading{align-items:flex-start;flex-direction:column}.table-tools{width:100%}.table-search{flex:1}.route-map{height:205px}}
    [hidden]{display:none!important}.proof-box{padding:12px;border:1px solid var(--line);border-radius:9px;background:#fafbfd}.proof-box canvas{display:block;width:100%;height:130px;touch-action:none;border:1px dashed #aeb8c6;border-radius:7px;background:#fff}.proof-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}.proof-preview{max-width:100%;max-height:150px;margin-top:8px;border-radius:7px}.form-feedback{grid-column:1/-1;color:#b54c40;font-size:13px}
  </style>
</head>

      const callback=document.getElementById("supportContact").value==="Phone call";
      const now=new Date();
      const request={id:`DF-RS-${now.toISOString().slice(2,10).replace(/-/g,"")}-${String(++riderSupportSequence).padStart(3,"0")}`,category:document.getElementById("supportTopic").value,trackingId:document.getElementById("supportTracking").value.trim().toUpperCase(),message:document.getElementById("supportMessage").value.trim(),channel:callback?"Phone callback":"In-app message",status:callback?"Callback requested":"Sent to dispatch",createdAt:now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};
      riderSupportRequests.unshift(request);
      closeModal();
      showToast(`${request.id} created · ${request.status}. Demo only.`);
      if(document.getElementById("breadcrumbPage").textContent==="Help & safety")render("Help & safety");
    },true);
    document.getElementById("actionForm").addEventListener("submit",event=>{
      if(!activeAction||activeAction.type!=="pickup")return;
      const record=readCustomerParcelRecord(activeAction.id);if(!record)return;
      event.preventDefault();event.stopImmediatePropagation();
      const action=activeAction,outcome=document.getElementById("pickupOutcome").value,note=document.getElementById("pickupNote").value.trim();
      if(record.status!=="Pickup assigned"||!assignedToThisRider(record)){showToast("This customer pickup is no longer assigned to your rider account.");closeModal();render(document.getElementById("breadcrumbPage").textContent);return}
      const atHub=outcome.includes("submit to hub"),exception=outcome==="Pickup exception",hub=atHub?document.getElementById("pickupHub").value:"",status=exception?"Exception":atHub?"At hub":"Out for delivery",detail=exception?`Pickup could not be completed. ${note||"Dispatch review required."}`:atHub?`Rider collected the parcel and handed it to ${hub}.${note?` ${note}`:""}`:`Rider collected the parcel and will deliver it directly.${note?` ${note}`:""}`;
      try{const updated=updateCustomerParcelRecord(action.id,status,detail,atHub?"Unassigned":record.rider,"",hub);updated.pickedUpAt=new Date().toISOString();localStorage.setItem("pairaexpress-customer-parcels",JSON.stringify(readCustomerParcelRecords().map(item=>item.trackingId===action.id?updated:item)))}catch(error){console.error("Customer parcel pickup update could not be saved.",error);showToast("Pickup update could not be saved. Check browser storage and retry.");return}
      closeModal();showToast(exception?`${action.id}: pickup exception sent to dispatch.`:atHub?`${action.id}: pickup completed and handed to hub.`:`${action.id}: picked up and ready for direct delivery.`);render(document.getElementById("breadcrumbPage").textContent);
    },true);
    document.getElementById("actionForm").addEventListener("submit",event=>{
      if(!activeAction||activeAction.type!=="delivery")return;
      event.preventDefault();event.stopImmediatePropagation();
      const id=activeAction.id,customerRecord=readCustomerParcelRecord(activeAction.id),row=deliveries.find(item=>item.id===id)||(customerRecord&&assignedToThisRider(customerRecord)?{id,recipient:customerRecord.recipient||"Recipient",phone:customerRecord.recipientPhone||"",address:customerRecord.destination||"Delivery address not set",type:"Customer parcel",time:"As assigned",status:customerRecord.status,cod:Number(customerRecord.codAmount)>0?`৳ ${customerRecord.codAmount}`:"Prepaid"}:null),outcome=document.getElementById("outcome").value,feedback=document.getElementById("proofFeedback");
      if(!row){feedback.textContent=`Delivery ${id} was not found in this sample route.`;return}
      let proof={};
      if(outcome==="Delivered successfully"){
        const method=document.getElementById("proofMethod").value;
        if(method==="Signature"&&!proofCanvasDirty){feedback.textContent="Capture the recipient's signature before completing delivery.";return}
        if(method==="OTP"&&document.getElementById("deliveryOtp").value!=="4810"){feedback.textContent="The demo OTP does not match. Enter 4810 to verify.";return}
        if(method==="Photo"&&!document.getElementById("deliveryPhoto").files.length){feedback.textContent="Upload the physical-signature photo to complete delivery.";return}
        proof={method,signature:method==="Signature"?document.getElementById("signatureCanvas").toDataURL():"",otpVerified:method==="OTP",photoName:method==="Photo"?document.getElementById("deliveryPhoto").files[0].name:""};
        row.status="Delivered";row.proof=proof;row.deliveredAt="Just now";row.failureReason="";
      }else{
        const reason=document.getElementById("failureReason").value,next=document.getElementById("nextStep").value;
        if(!reason||!next){feedback.textContent="Choose a failure reason and the next action.";return}
        row.attempts=(row.attempts||0)+1;row.failureReason=reason;row.failureNote=document.getElementById("failureNote").value.trim();row.nextStep=next;
        row.status=next==="Return to hub"?"At hub":"Retry scheduled";row.proof=null;
      }
      if(customerRecord){const status=row.status,detail=status==="Delivered"?`Delivery completed with ${proof.method} proof.`:`Delivery attempt: ${row.failureReason||"issue"} · ${row.nextStep||status}.`;try{updateCustomerParcelRecord(id,status,detail,status==="At hub"?"Unassigned":customerRecord.rider,status==="Delivered"?`${proof.method} proof recorded`:"")}catch(error){console.error("Customer parcel delivery update could not be saved.",error);feedback.textContent="Delivery update could not be saved. Check browser storage and retry.";return}}
      closeModal();showToast(outcome==="Delivered successfully"?`${id} delivered. ${proof.method} proof saved.`:`${id}: ${row.failureReason} · ${row.nextStep}.`);render(document.getElementById("breadcrumbPage").textContent);
    },true);
    window.addEventListener("storage",event=>{if(event.key!=="pairaexpress-customer-parcels")return;const page=document.getElementById("breadcrumbPage").textContent;if(page==="Pickup queue"||page==="Deliveries")render(page)});
  </script>
  <script src="support.js"></script>
</body>
</html>
