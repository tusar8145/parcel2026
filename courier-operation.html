    };
    function serviceCategory(shipment){if(shipment.serviceCategory)return shipment.serviceCategory;if(shipment.service==="Customer parcel")return "Customer parcels";if(shipment.service==="Document express")return "Documents";return "E-commerce"}
    function statusPill(text){const s=text.toLowerCase();let c="status-blue";if(s.includes("deliver")||s==="met"||s==="healthy"||s==="operational"||s==="active"||s==="paid"||s==="reconciled"||s==="ready")c="status-good";else if(s.includes("risk")||s.includes("issue")||s==="review"||s==="monitor"||s==="busy"||s==="at capacity"||s==="processing")c="status-warn";else if(s.includes("exception")||s==="critical")c="status-bad";return `<span class="status ${c}">${text}</span>`}
    function metric(label,value,ico,trend,note){return `<article class="metric"><div class="metric-head"><span>${label}</span><span class="metric-icon">${icon(ico)}</span></div><div class="metric-value">${value}</div><div class="metric-foot"><span class="trend">${trend}</span><span>${note}</span></div></article>`}

    function isPendingCustomerPickup(shipment){return serviceCategory(shipment)==="Customer parcels"&&["Pickup requested","Pending operations confirmation"].includes(shipment.status)}
    function persistCustomerPickupStatus(shipment,status){
      const records=JSON.parse(localStorage.getItem("deliveryfast-customer-parcels")||"[]");
      if(!Array.isArray(records))throw new Error("Saved customer parcel list has an invalid format.");
      const record=records.find(row=>row?.trackingId===shipment.id);
      if(!record)throw new Error("The customer pickup record is missing from browser storage.");
      const now=new Date().toLocaleString(),title=status==="Pickup confirmed"?"Pickup confirmed by operations":"Pickup request cancelled by operations";
      record.status=status;record.customerCanCancel=false;record.updatedAt=now;
      record.events=[...(Array.isArray(record.events)?record.events:[]),{time:now,title,place:"Courier operations",detail:status==="Pickup confirmed"?"Operations approved the pickup request. The sender can no longer cancel it.":"Operations cancelled the pickup request."}];
      localStorage.setItem("deliveryfast-customer-parcels",JSON.stringify(records));
      return record;
    }
    function shipmentRows(rows){return `<div class="table-scroll"><table><thead><tr><th>CN / TRACKING ID</th><th>MERCHANT / RECIPIENT</th><th>DESTINATION</th><th>RIDER</th><th>STATUS</th><th>SLA</th><th></th></tr></thead><tbody id="shipmentBody">${rows.map(s=>`<tr><td class="tracking">${courierEscape(s.id)}<span class="subcell">${courierEscape(serviceCategory(s))} · ${courierEscape(s.service)} · ${courierEscape(s.created)}${serviceCategory(s)==="Customer parcels"?` · Sender pays ৳${Number(s.deliveryFee)||0} · COD ৳${Number(s.codAmount)||0} · fee ৳${Number(s.codFee)||0}`:""}</span></td><td><strong style="color:#455265;font-weight:600">${courierEscape(s.merchant||"Merchant not set")}</strong><span class="subcell">${courierEscape(s.recipient||"Recipient not set")}</span></td><td>${courierEscape(s.destination||"Address not set")}</td><td>${courierEscape(s.rider)}</td><td>${statusPill(s.status)}${s.generatedCN?`<select aria-label="Update CN ${courierEscape(s.id)} status" data-generated-status="${courierEscape(s.id)}">${["CN generated","Order created","Pickup confirmed","At hub","In transit","Out for delivery","Delivered","Exception","Cancelled"].map(status=>`<option ${s.status===status?"selected":""}>${status}</option>`).join("")}</select>`:""}</td><td>${statusPill(s.sla)}</td><td><button class="button button-sm" data-track="${courierEscape(s.id)}">History</button><button class="button button-sm" data-generated-edit="${courierEscape(s.id)}">Edit details</button>${serviceCategory(s)==="Customer parcels"&&isPendingCustomerPickup(s)?`<button class="button button-sm" data-customer-confirm="${courierEscape(s.id)}">Confirm pickup</button><button class="button button-sm" data-customer-cancel="${courierEscape(s.id)}">Cancel request</button>`:serviceCategory(s)==="Customer parcels"&&!s.generatedCN&&s.status!=="Pickup cancelled"?`<select aria-label="Update customer parcel ${courierEscape(s.id)} status" data-customer-status="${courierEscape(s.id)}"><option ${s.status==="Pickup confirmed"?"selected":""}>Pickup confirmed</option><option ${s.status==="At hub"?"selected":""}>At hub</option><option ${s.status==="In transit"?"selected":""}>In transit</option><option ${s.status==="Out for delivery"?"selected":""}>Out for delivery</option><option ${s.status==="Delivered"?"selected":""}>Delivered</option><option ${s.status==="Exception"?"selected":""}>Exception</option></select>`:""}${s.status==="Exception"||s.sla==="At risk"?` <button class="button button-sm" data-exception="${courierEscape(s.id)}">Review</button>`:""}</td></tr>`).join("")}</tbody></table></div>`}

    function serviceOperationsPage(page){const category=page==="Customer parcels"?"Customer parcels":page==="E-commerce operations"?"E-commerce":"Documents",data=shipments.filter(s=>serviceCategory(s)===category),delivered=data.filter(s=>s.status==="Delivered").length,attention=data.filter(s=>s.status==="Exception"||s.sla==="At risk"||s.rider==="Unassigned").length,inProgress=data.filter(s=>["Pending operations confirmation","Pickup requested","Pickup confirmed","In transit","Out for delivery"].includes(s.status)).length,title=page==="Customer parcels"?"Customer parcels":page==="E-commerce operations"?"E-commerce operations":"Document operations",description=page==="Customer parcels"?"Website pickup requests; operations confirms or cancels them. Senders can cancel only before confirmation.":category==="E-commerce"?"Merchant parcel fulfillment, COD, pickups, and returns.":"Document consignments, recipient verification, secure handoffs, and proof of delivery.";return `<div class="page-heading"><div><p class="eyebrow">Dedicated service line · Shared courier network</p><h1>${title}</h1><p class="subtitle">${description}</p></div><div class="heading-actions"><button class="button" data-action="export">${icon("download")} Export</button>${page==="Customer parcels"?`<a class="button button-primary" href="website.html#/request">New website pickup ↗</a>`:`<button class="button button-primary" data-action="${category==="E-commerce"?"newEcommerce":"newDomestic"}">${icon("plus")} New ${category==="E-commerce"?"e-commerce order":"document shipment"}</button>`}</div></div><div class="metrics">${metric("Active shipments",String(data.length),"box","this service line","sample register")}${metric("In progress",String(inProgress),"truck","pending confirmation or delivery","active")}${metric("Delivered",String(delivered),"check","completed stops","sample data")}${metric("Needs attention",String(attention),"alert","unassigned, SLA, or exception","operations queue")}</div>${page==="Custo     function exceptionPanel(){const data=shipments.filter(s=>s.status==="Exception"||s.sla==="At risk"||s.status==="At hub");return `<div class="stats-mini"><div class="mini-card"><span>Open exceptions</span><strong>12</strong></div><div class="mini-card"><span>SLA at risk</span><strong>3</strong></div><div class="mini-card"><span>Awaiting action</span><strong>7</strong></div></div><section class="panel table-panel"><div class="panel-heading"><div><h2 class="panel-title">Exception work queue</h2><p class="panel-subtitle">Resolve blockers before the delivery promise expires.</p></div><input class="table-search" id="shipmentSearch" placeholder="Search exceptions..." aria-label="Search exceptions"></div>${shipmentRows(data)}<div class="empty-state">Review each exception and coordinate with the assigned rider or hub.</div></section>`}

iv class="panel-heading"><div><h2 class="panel-title">Active route roster</h2><p class="panel-subtitle">Rider workloads and route health</p></div><button class="button button-sm" data-page-link="Riders">All riders</button></div><div class="table-scroll"><table><thead><tr><th>RIDER</th><th>SERVICE ZONE</th><th>ASSIGNED STOPS</th><th>COMPLETED</th><th>REMAINING</th><th>ROUTE HEALTH</th></tr></thead><tbody><tr><td>R-2048 · Jordan Rivera</td><td>Dhaka North</td><td>12</td><td>4</td><td>8</td><td>${statusPill("On track")}</td></tr><tr><td>R-2016 · Samira Khan</td><td>Dhaka Central</td><td>10</td><td>6</td><td>4</td><td>${statusPill("On track")}</td></tr><tr><td>R-2051 · Imran Hasan</td><td>Dhaka North</td><td>11</td><td>5</td><td>6</td><td>${statusPill("Issue")}</td></tr></tbody></table></div></section>`}
    let modalContext={};
    function openModal(kind,shipmentId){modalContext={kind,shipmentId};const title=document.getElementById("modalTitle"),desc=document.getElementById("modalDescription"),fields=document.getElementById("modalFields"),submit=document.getElementById("modalSubmit");
      if(kind==="assign"){title.textContent="Assign a shipment";desc.textContent="Select an unassigned shipment and an available rider.";submit.textContent="Confirm assignment";fields.innerHTML=`<div class="field full"><label for="assignShipment">Shipment</label><select id="assignShipment" required>${shipments.filter(s=>s.rider==="Unassigned").map(s=>`<option value="${s.id}" ${s.id===shipmentId?"selected":""}>${s.id} · ${s.destination}</option>`).join("")}<option value="PP-28512">PP-28512 · Farmgate, Dhaka</option></select></div><div class="field full"><label for="assignRider">Available rider</label><select id="assignRider" required><option>R-2029 · Ayesha Noor · Dhaka North</option><option>R-2030 · Tanvir Alam · Dhaka Central</option><option>R-2041 · Nabila Sultana · Dhaka North</option></select></div><div class="field full"><label for="assignPriority">Dispatch priority</label><select id="assignPriority"><option>Standard</option><option>Urgent · SLA at risk</option><option>Express document</option></select></div>`}

      else if(kind==="newShipment"||kind==="newEcommerce"||kind==="newDomestic"){const selectedCategory=kind==="newEcommerce"?"E-commerce":kind==="newDomestic"?"Domestic & documents":"";title.textContent=selectedCategory==="E-commerce"?"Create e-commerce shipment":selectedCategory==="Domestic & documents"?"Create domestic / document shipment":"Create shipment";desc.textContent=selectedCategory?`Create a shipment in the ${selectedCategory} service line.`:"Choose which service line will handle this shipment.";submit.textContent="Create shipment";fields.innerHTML=`<div class="field ${selectedCategory?"":"full"}"><label for="newCategory">Service line</label><select id="newCategory" ${selectedCategory?"disabled":""}><option ${selectedCategory==="E-commerce"?"selected":""}>E-commerce</option><option ${selectedCategory==="Domestic & documents"?"selected":""}>Domestic & documents</option></select></div><div class="field ${selectedCategory?"":"full"}"><label for="newMerchant">Merchant / account</label><select id="newMerchant"><option>Northstar Store</option><option>Craft & Co.</option><option>Papertrail Legal</option></select></div><div class="field full"><label for="newService">Service type</label><select id="newService">${selectedCategory==="E-commerce"?`<option>E-commerce parcel</option><option>Same-day parcel</option><option>Cash on delivery</option>`:selectedCategory==="Domestic & documents"?`<option>Document express</option><option>Domestic parcel</option>`:`<option>E-commerce parcel</option><option>Same-day parcel</option><option>Cash on delivery</option><option>Document express</option><option>Domestic parcel</option>`}</select></div><div class="field full"><label for="newRecipient">Recipient name</label><input id="newRecipient" required placeholder="Recipient name"></div><div class="field full"><label for="newDestination">Destination</label><input id="newDestination" required placeholder="Area, city"></div>`}

    function exportCurrentData(){const page=document.getElementById("breadcrumbPage").textContent;let headers,rows,fileName;const shipmentHeaders=["Tracking ID","Service line","Merchant","Recipient","Destination","Service","Created","Rider","Status","SLA"];const toShipmentRow=s=>[s.id,serviceCategory(s),s.merchant,s.recipient,s.destination,s.service,s.created,s.rider,s.status,s.sla];if(page==="Live overview"||page==="Shipments"){headers=shipmentHeaders;rows=shipments.map(toShipmentRow);fileName="shipments"}else if(page==="E-commerce operations"||page==="Domestic & documents"){const category=page==="E-commerce operations"?"E-commerce":"Domestic & documents";headers=shipmentHeaders;rows=shipments.filter(s=>serviceCategory(s)===category).map(toShipmentRow);fileName=category.toLowerCase().replaceAll(" ","-").replaceAll("&","and")}else if(page==="Exceptions"){headers=shipmentHeaders;rows=shipments.filter(s=>s.status==="Exception"||s.sla==="At risk"||s.status==="At hub").map(toShipmentRow);fileName="exceptions"}else if(genericPages[page]&&genericPages[page].cols){headers=genericPages[page].cols;rows=genericPages[page].rows;fileName=page.toLowerCase().replaceAll(" ","-").replaceAll("&","and")}else{showToast("There is no export data for this view.");return}const csv=[headers,...rows].map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`delivery-fast-${fileName}.csv`;a.click();URL.revokeObjectURL(a.href);showToast(`${page} data exported as CSV.`)}

      if(shipment.status==="Pickup requested"||shipment.status==="Pending operations confirmation"||shipment.status==="Pickup cancelled"){showToast("Confirm the pickup before updating its delivery status.");render("Customer parcels");return}
      shipment.status=select.value;shipment.sla=select.value==="Delivered"?"Met":select.value==="Exception"?"At risk":"On track";shipment.history??=[];shipment.history.push(`${shipment.status} · courier operations`);
      try{const saved=JSON.parse(localStorage.getItem("deliveryfast-customer-parcels")||"[]");if(!Array.isArray(saved))throw new Error("Saved customer parcel list has an invalid format.");const record=saved.find(row=>row.trackingId===shipment.id);if(record){record.status=shipment.status;record.customerCanCancel=false;record.updatedAt=new Date().toLocaleString();record.events=[...(Array.isArray(record.events)?record.events:[]),{time:record.updatedAt,title:shipment.status,place:"Courier operations",detail:"Shipment status updated by operations."}];localStorage.setItem("deliveryfast-customer-parcels",JSON.stringify(saved))}}catch(error){console.error("Customer parcel status could not be saved.",error);showToast("Status changed in this courier view, but could not be saved to browser storage.");render("Customer parcels");return}
      const page=document.getElementById("breadcrumbPage").textContent;render(page);showToast(`${shipment.id} updated to ${shipment.status}.`);
    });
    window.addEventListener("storage",event=>{if(event.key!=="deliveryfast-customer-parcels")return;syncWebsiteCustomerParcels();if(document.querySelector('[data-page="Customer parcels"].active'))render("Customer parcels")});
  </script>
  <script>
    const generatedCNStorageKey="deliveryfast-generated-cns";
    const generatedCNStatuses=["CN generated","Order created","Pickup confirmed","At hub","In transit","Out for delivery","Delivered","Exception","Cancelled"];
    function readGeneratedCNs(){
      const raw=localStorage.getItem(generatedCNStorageKey);
      if(!raw)return [];
      const records=JSON.parse(raw);
      if(!Array.isArray(records))throw new Error("Generated CN storage has an invalid format.");
      return records.filter(record=>record&&record.generatedCN===true&&typeof record.id==="string");
    }
    function saveGeneratedCNs(){
      try{localStorage.setItem(generatedCNStorageKey,JSON.stringify(shipments.filter(shipment=>shipment.generatedCN)))}
      catch(error){console.error("Generated CN records could not be saved.",error);showToast("CN records were not saved. Check browser storage permissions and retry.");return false}
      return true;
    }
    function generatedCNPageCategory(page){return page==="Customer parcels"?"Customer parcels":page==="Document operations"?"Documents":page==="E-commerce operations"?"E-commerce":""}
    function generatedCNDialog(){
      if(document.getElementById("generatedCNDialog"))return;
      document.body.insertAdjacentHTML("beforeend",`<style id="generatedCNStyles">.cn-dialog{width:min(480px,calc(100% - 32px));padding:0;border:1px solid var(--line);border-radius:12px;color:var(--ink);box-shadow:0 24px 70px #10182840}.cn-dialog::backdrop{background:#17203377}.cn-dialog form{padding:20px}.cn-dialog h2{margin:0 0 5px;font-size:18px}.cn-dialog p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5}.cn-dialog label{display:grid;gap:6px;margin:12px 0;color:#637083;font-size:13px;font-weight:600}.cn-dialog input,.cn-dialog select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink)}.cn-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.cn-dialog-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cn-dialog-grid label{margin:0}.cn-generated-toolbar{display:flex;gap:8px;flex-wrap:wrap}.cn-dialog .cn-span-full{grid-column:1/-1}</style><dialog class="cn-dialog" id="generatedCNDialog"><form id="generatedCNForm"><h2 id="generatedCNTitle"></h2><p id="generatedCNDescription"></p><div id="generatedCNFields"></div><div class="cn-dialog-actions"><button class="button" type="button" data-generated-close>Cancel</button><button class="button button-primary" type="submit" id="generatedCNSubmit">Generate CNs</button></div></form></dialog>`);
    }
    function openGeneratedCNDialog(mode,shipment){
      generatedCNDialog();
      const dialog=document.getElementById("generatedCNDialog"),form=document.getElementById("generatedCNForm"),title=document.getElementById("generatedCNTitle"),description=document.getElementById("generatedCNDescription"),fields=document.getElementById("generatedCNFields"),submit=document.getElementById("generatedCNSubmit");
      form.dataset.mode=mode;form.dataset.shipmentId=shipment?.id||"";
      if(mode==="generate"){
        const selectedCategory=generatedCNPageCategory(document.getElementById("breadcrumbPage").textContent);
        title.textContent="Generate consignment numbers";
        description.textContent="Create blank parcel records with unique barcoded CNs, then edit the merchant, recipient, address, and other details.";
        fields.innerHTML=`<div class="cn-dialog-grid"><label>Number of CNs<input name="count" type="number" min="1" max="500" step="1" value="1" required></label><label>Service line<select name="category"><option value="E-commerce" ${selectedCategory==="E-commerce"?"selected":""}>E-commerce</option><option value="Documents" ${selectedCategory==="Documents"?"selected":""}>Documents</option><option value="Customer parcels" ${selectedCategory==="Customer parcels"?"selected":""}>Customer parcels</option></select></label></div>`;
        submit.textContent="Generate CNs";
      }else{
        title.textContent=`Edit parcel · ${courierEscape(shipment.id)}`;
        description.textContent="Update merchant, recipient, destination, service, COD, rider, or status. Changes save in this browser.";
        const input=(name,label,value,type="text")=>`<label>${label}<input name="${name}" type="${type}" value="${courierEscape(value??"")}" ${type==="number"?'min="0" step="0.01"':""}></label>`;
        const categories=[["E-commerce","E-commerce"],["Documents","Documents"],["Customer parcels","Customer parcels"]];
        fields.innerHTML=`<div class="cn-dialog-grid">${input("merchant","Merchant / sender",shipment.merchant)}${input("recipient","Recipient name",shipment.recipient)}${input("recipientPhone","Recipient phone",shipment.recipientPhone)}${input("destination","Delivery address",shipment.destination)}<label>Service line<select name="category">${categories.map(([value,label])=>`<option value="${value}" ${serviceCategory(shipment)===value?"selected":""}>${label}</option>`).join("")}</select></label>${input("service","Service type",shipment.service)}${input("item","Parcel contents",shipment.item)}${input("weight","Weight",shipment.weight,"number")}${input("codAmount","COD amount",shipment.codAmount||0,"number")}${input("rider","Rider",shipment.rider)}<label>Status<select name="status">${[...new Set([...generatedCNStatuses,shipment.status])].map(status=>`<option ${shipment.status===status?"selected":""}>${courierEscape(status)}</option>`).join("")}</select></label>${input("sla","SLA",shipment.sla)}</div>`;
        submit.textContent="Save parcel details";
      }
      dialog.showModal();
      fields.querySelector("input")?.focus();
    }
    function closeGeneratedCNDialog(){const dialog=document.getElementById("generatedCNDialog");if(dialog?.open)dialog.close()}
    function createGeneratedCNs(count,category){
      const created=[],dateCode=new Date().toISOString().slice(2,10).replaceAll("-",""),prefix=`CN-${dateCode}-`;
      let nextNumber=shipments.reduce((highest,shipment)=>{const match=shipment.id.match(new RegExp(`^CN-${dateCode}-(\\d+)$`));return match?Math.max(highest,Number(match[1])):highest},0)+1;
      for(let i=0;i<count;i++){
        let id;do{id=`${prefix}${String(nextNumber++).padStart(5,"0")}`}while(shipments.some(shipment=>shipment.id===id));
        const service=category==="Documents"?"Document shipment":category==="Customer parcels"?"Customer parcel":"E-commerce parcel",createdAt=new Date().toLocaleString();
        const shipment={id,generatedCN:true,merchant:"",recipient:"",recipientPhone:"",destination:"",service,serviceCategory:category,created:createdAt,rider:"Unassigned",status:"CN generated",sla:"Awaiting details",codAmount:0,item:"",weight:"",history:[`${createdAt} · CN generated`]};
        shipments.unshift(shipment);created.push(shipment);
      }
      return created;
    }
    function printGeneratedCNs(page){
      const category=generatedCNPageCategory(page),rows=shipments.filter(shipment=>shipment.generatedCN&&(!category||serviceCategory(shipment)===category));
      if(!rows.length){showToast("There are no generated CNs to print in this view.");return}
      courierPrint("label",page,rows);
    }
    generatedCNDialog();
    document.getElementById("generatedCNDialog").addEventListener("click",event=>{if(event.target.closest("[data-generated-close]"))closeGeneratedCNDialog()});
    try{for(const record of readGeneratedCNs())if(!shipments.some(shipment=>shipment.id===record.id))shipments.unshift(record)}
    catch(error){console.error("Generated CN records could not be loaded.",error);showToast("Saved CN records could not be loaded from this browser.")}
    document.getElementById("mainContent").addEventListener("click",event=>{
      const generate=event.target.closest("#generateCNs"),print=event.target.closest("#printGeneratedCNs"),edit=event.target.closest("[data-generated-edit]"),close=event.target.closest("[data-generated-close]");
      if(generate){openGeneratedCNDialog("generate");return}
      if(print){printGeneratedCNs(document.getElementById("breadcrumbPage").textContent);return}
      if(edit){const shipment=shipments.find(record=>record.id===edit.dataset.generatedEdit);if(shipment)openGeneratedCNDialog("edit",shipment);return}
      if(close)closeGeneratedCNDialog();
    });
    document.getElementById("generatedCNForm").addEventListener("submit",event=>{
      event.preventDefault();
      const form=event.currentTarget,data=new FormData(form);
      if(form.dataset.mode==="generate"){
        const count=Number(data.get("count")),category=String(data.get("category"));
        if(!Number.isInteger(count)||count<1||count>500){showToast("Enter a whole number of CNs between 1 and 500.");return}
        const created=createGeneratedCNs(count,category);
        if(!saveGeneratedCNs()){shipments.splice(0,shipments.length,...shipments.filter(shipment=>!created.includes(shipment)));return}
        closeGeneratedCNDialog();
        const page=document.getElementById("breadcrumbPage").textContent;
        render(page==="Live overview"?"Overview":page);
        showToast(`${created.length} CN(s) generated. Add parcel details and print the barcoded labels when ready.`);
        return;
      }
      const shipment=shipments.find(record=>record.id===form.dataset.shipmentId);
      if(!shipment||!shipment.generatedCN){showToast("This generated CN could not be found.");closeGeneratedCNDialog();return}
      for(const key of ["merchant","recipient","recipientPhone","destination","service","item","weight","rider","sla"])shipment[key]=String(data.get(key)||"").trim();
      shipment.serviceCategory=String(data.get("category"));
      shipment.codAmount=Number(data.get("codAmount"))||0;
      const status=String(data.get("status"));
      if(status!==shipment.status){shipment.status=status;shipment.history.push(`${new Date().toLocaleString()} · ${status}`)}
      if(status==="Delivered"&&shipment.sla==="Awaiting details")shipment.sla="Met";
      if(!saveGeneratedCNs())return;
      closeGeneratedCNDialog();
      const page=document.getElementById("breadcrumbPage").textContent;
      render(page==="Live overview"?"Overview":page);
      showToast(`${shipment.id} details saved.`);
    });
    document.getElementById("mainContent").addEventListener("change",event=>{
      const select=event.target.closest("[data-generated-status]");
      if(!select)return;
      const shipment=shipments.find(record=>record.id===select.dataset.generatedStatus&&record.generatedCN);
      if(!shipment)return;
      shipment.status=select.value;
      shipment.sla=select.value==="Delivered"?"Met":select.value==="Exception"?"At risk":select.value==="Cancelled"?"Cancelled":shipment.sla;
      shipment.history.push(`${new Date().toLocaleString()} · ${shipment.status}`);
      if(!saveGeneratedCNs())return;
      const page=document.getElementById("breadcrumbPage").textContent;
      render(page==="Live overview"?"Overview":page);
      showToast(`${shipment.id} status updated to ${shipment.status}.`);
    });
    window.addEventListener("storage",event=>{
      if(event.key!==generatedCNStorageKey)return;
      try{
        const saved=readGeneratedCNs(),savedIds=new Set(saved.map(record=>record.id));
        for(let i=shipments.length-1;i>=0;i--)if(shipments[i].generatedCN&&!savedIds.has(shipments[i].id))shipments.splice(i,1);
        for(const record of saved){const existing=shipments.find(shipment=>shipment.id===record.id);if(existing)Object.assign(existing,record);else shipments.unshift(record)}
        const page=document.getElementById("breadcrumbPage").textContent;
        render(page==="Live overview"?"Overview":page);
      }catch(error){console.error("Generated CN updates could not be synchronized.",error);showToast("CN updates from another tab could not be loaded.")}
    });
    const activeCourierPage=document.querySelector(".nav-item.active")?.dataset.page||"Overview";
    render(activeCourierPage);
  </script>
  <script src="support.js"></script>
</body>
</html>
