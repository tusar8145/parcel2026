    function serviceCategory(shipment){return shipment.service==="Document express"||shipment.service==="Domestic parcel"?"Domestic & documents":"E-commerce"}
    function statusPill(text){const s=text.toLowerCase();let c="status-blue";if(s.includes("deliver")||s==="met"||s==="healthy"||s==="operational"||s==="active"||s==="paid"||s==="reconciled"||s==="ready")c="status-good";else if(s.includes("risk")||s.includes("issue")||s==="review"||s==="monitor"||s==="busy"||s==="at capacity"||s==="processing")c="status-warn";else if(s.includes("exception")||s==="critical")c="status-bad";return `<span class="status ${c}">${text}</span>`}
    function metric(label,value,ico,trend,note){return `<article class="metric"><div class="metric-head"><span>${label}</span><span class="metric-icon">${icon(ico)}</span></div><div class="metric-value">${value}</div><div class="metric-foot"><span class="trend">${trend}</span><span>${note}</span></div></article>`}

    function shipmentRows(rows){return `<div class="table-scroll"><table><thead><tr><th>TRACKING ID</th><th>MERCHANT / RECIPIENT</th><th>DESTINATION</th><th>RIDER</th><th>STATUS</th><th>SLA</th><th></th></tr></thead><tbody id="shipmentBody">${rows.map(s=>`<tr><td class="tracking">${s.id}<span class="subcell">${serviceCategory(s)} · ${s.service} · ${s.created}</span></td><td><strong style="color:#455265;font-weight:600">${s.merchant}</strong><span class="subcell">${s.recipient}</span></td><td>${s.destination}</td><td>${s.rider}</td><td>${statusPill(s.status)}</td><td>${statusPill(s.sla)}</td><td>${s.status==="Exception"||s.sla==="At risk"?`<button class="button button-sm" data-exception="${s.id}">Review</button>`:`<button class="button button-sm" data-track="${s.id}">Details</button>`}</td></tr>`).join("")}</tbody></table></div>`}
    function alertMarkup(){return `<div class="alert-list"><div class="alert-item"><span class="alert-icon red">${icon("alert")}</span><div class="alert-copy"><strong>Delivery exception · PP-28499</strong>Recipient unavailable in Mirpur 11.<small>Assigned to Imran H. · 12 min ago</small></div><button class="button button-sm alert-action" data-exception="PP-28499">Review</button></div><div class="alert-item"><span class="alert-icon">${icon("clock")}</span><div class="alert-copy"><strong>SLA at risk · PP-28509</strong>Uttara delivery window closes in 28 minutes.<small>Assigned to Rashed M. · 18 min ago</small></div><button class="button button-sm alert-action" data-exception="PP-28509">Review</button></div><div class="alert-item"><span class="alert-icon">${icon("box")}</span><div class="alert-copy"><strong>Hub backlog · Chattogram</strong>32 parcels waiting for sortation.<small>Capacity at 91% · updated 5 min ago</small></div><button class="button button-sm alert-action" data-page-link="Hubs">Hub</button></div><div class="alert-item"><span class="alert-icon">${icon("wallet")}</span><div class="alert-copy"><strong>COD review · FreshBasket BD</strong>Settlement variance needs finance approval.<small>Batch COD-2026-1013-D</small></div><button class="button button-sm alert-action" data-page-link="COD & finance">Review</button></div></div>`}

ection class="panel"><div class="panel-heading"><div><h2 class="panel-title">Live network map</h2><p class="panel-subtitle">Rider positions, active hubs, and incidents · Dhaka operations</p></div><select class="select-small" id="mapCity" aria-label="Select service area"><option>Dhaka North</option><option>All cities</option><option>Dhaka Central</option><option>Dhaka South</option><option>Chattogram</option><option>Sylhet</option></select></div>${mapMarkup()}</section><section class="panel"><div class="panel-heading"><div><h2 class="panel-title">Network health</h2><p class="panel-subtitle">Today's fulfillment status</p></div><button class="button button-sm" data-page-link="Analytics">SLA report</button></div><div class="network-summary"><div><strong>2,486</strong><span>Today's shipments</span></div><i class="divider"></i><div><strong>1,802</strong><span>Delivered</span></div><i class="divider"></i><div><strong>12</strong><span>Exceptions</span></div></div><div class="progress-label"><span>On-time delivery target · ≥ 95%</span><strong>96.8%</strong></div><div class="progress-track"><div class="progress-fill"></div></div><div class="dispatch-list"><div class="dispatch-row"><span class="dispatch-label"><i style="background:#3766e8"></i>At hub / sorting</span><strong>318</strong></div><div class="dispatch-row"><span class="dispatch-label"><i style="background:#16845b"></i>Delivered today</span><strong>1,802</strong></div><div class="dispatch-row"><span class="dispatch-label"><i style="background:#b87913"></i>Out for delivery</span><strong>684</strong></div><div class="dispatch-row"><span class="dispatch-label"><i style="background:#c34d4d"></i>Delivery exceptions</span><strong>12</strong></div></div></section></div><div class="lower-grid"><section class="panel table-panel"><div class="panel-heading"><div><h2 class="panel-title">Live shipment feed</h2><p class="panel-subtitle">Recently updated shipments across the courier network</p></div><div class="table-tools"><input id="shipmentSearch" class="table-search" placeholder="Search shipment..." aria-label="Search shipments"><button class="button button-sm" data-page-link="Shipments">All shipments</button></div></div>${shipmentRows(shipments.slice(0,6))}</section><section class="panel"><div class="panel-heading"><div><h2 class="panel-title">Priority alerts</h2><p class="panel-subtitle">Items requiring operations attention</p></div><span class="status status-warn">4 open</span></div>${alertMarkup()}</section></div>`}
    function serviceOperationsPage(page){const category=page==="E-commerce operations"?"E-commerce":"Domestic & documents";const data=shipments.filter(s=>serviceCategory(s)===category);const delivered=data.filter(s=>s.status==="Delivered").length;const attention=data.filter(s=>s.status==="Exception"||s.sla==="At risk"||s.rider==="Unassigned").length;const inProgress=data.filter(s=>s.status==="In transit"||s.status==="Out for delivery").length;const title=page==="E-commerce operations"?"E-commerce operations":"Domestic & document operations";const description=category==="E-commerce"?"Manage merchant parcel fulfillment, ecommerce pickups, cash on delivery, and returns.":"Manage domestic parcels and document express deliveries, routing, handoffs, and proof of delivery.";return `<div class="page-heading"><div><p class="eyebrow">Dedicated service line · Shared courier network</p><h1>${title}</h1><p class="subtitle">${description}</p></div><div class="heading-actions"><button class="button" data-action="export">${icon("download")} Export</button><button class="button button-primary" data-action="${category==="E-commerce"?"newEcommerce":"newDomestic"}">${icon("plus")} New ${category==="E-commerce"?"e-commerce order":"domestic shipment"}</button></div></div><div class="metrics">${metric("Active shipments",String(data.length),"box","this service line","sample register")}${metric("In progress",String(inProgress),"truck","assigned to riders","out for delivery")}${metric("Delivered",String(delivered),"check","completed stops","sample data")}${metric("Needs attention",String(attention),"alert","unassigned, SLA, or exception","operations queue")}</div><div class="stats-mini"><div class="mini-card"><span>Service line</span><strong>${category}</strong></div><div class="mini-card"><span>Operations model</span><strong>${category==="E-commerce"?"Merchant fulfillment":"Domestic courier"}</strong></div><div class="mini-card"><span>Network resources</span><strong>Shared riders & hubs</strong></div></div><section class="panel table-panel"><div class="panel-heading"><div><h2 class="panel-title">${category} shipment queue</h2><p class="panel-subtitle">Dedicated queue · shared fleet, hubs, and tracking platform</p></div><div class="table-tools"><input class="table-search" id="shipmentSearch" placeholder="Search this service line..." aria-label="Search this service line"><select class="select-small" id="statusFilter" aria-label="Filter service-line shipments"><option value="">All statuses</option><option>At hub</option><option>In transit</option><option>Out for delivery</option><option>Exception</option><option>Delivered</option></select></div></div>${shipmentRows(data)}<div style="padding:11px 16px;border-top:1px solid var(--line);color:#98a2ae;font-size:8px">Showing ${data.length} ${category.toLowerCase()} sample shipments · New records stay in this service line for this demo session.</div></section>`}
    function pageTable(page){if(page==="E-commerce operations"||page==="Domestic & documents")return serviceOperationsPage(page);if(page==="Exceptions")return `<div class="page-heading"><div><p class="eyebrow">Network operations</p><h1>Exceptions</h1><p class="subtitle">Resolve delivery blockers and protect customer delivery commitments.</p></div><button class="button" data-action="export">${icon("download")} Export queue</button></div>${exceptionPanel()}`;if(page==="Shipments"){const rows=shipments;return `<div class="page-heading"><div><p class="eyebrow">Network operations</p><h1>Shipments</h1><p class="subtitle">${genericPages.Shipments.description}</p></div><div class="heading-actions"><button class="button" data-action="export">${icon("download")} Export</button><button class="button" data-action="newShipment">${icon("plus")} New shipment</button><button class="button button-primary" data-action="assign">${icon("route")} Assign rider</button></div></div><div class="stats-mini"><div class="mini-card"><span>In transit</span><strong>684</strong></div><div class="mini-card"><span>At hub</span><strong>318</strong></div><div class="mini-card"><span>Exceptions</span><strong>12</strong></div></div><section class="panel table-panel"><div class="panel-heading"><div><h2 class="panel-title">Network shipment register</h2><p class="panel-subtitle">Sample records · real-time status feed</p></div><div class="table-tools"><input class="table-search" id="shipmentSearch" placeholder="Search shipments..." aria-label="Search shipments"><select class="select-small" id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option><option>Out for delivery</option><option>In transit</option><option>At hub</option><option>Exception</option><option>Delivered</option></select></div></div>${shipmentRows(rows)}<div style="padding:11px 16px;border-top:1px solid var(--line);color:#98a2ae;font-size:8px">Showing ${rows.length} sample shipments · Data resets when refreshed</div></section>`}const cfg=genericPages[page];let rows=cfg.rows;
      return `<div class="page-heading"><div><p class="eyebrow">Network operations</p><h1>${page}</h1><p class="subtitle">${cfg.description}</p></div><div class="heading-actions">${["Riders","Dispatch"].includes(page)?`<button class="button button-primary" data-action="${page==="Riders"?"rider":"assign"}">${icon("plus")} ${page==="Riders"?"Add rider":"Create dispatch"}</button>`:`<button class="button" data-action="export">${icon("download")} Export</button>`}</div></div>${page==="COD & finance"?`<div class="metrics">${metric("COD collected","৳ 4.82M","wallet","2,104 orders","today")}${metric("Ready to remit","৳ 1.26M","chart","286 merchants","daily cycle")}${metric("Awaiting reconciliation","৳ 184K","clock","4 batches","review")}${metric("Settlement success","99.2%","check","↑ 0.8 pts","this month")}</div>`:""}${page==="Exceptions"?exceptionPanel():`<section class="panel table-panel"><div class="panel-heading"><div><h2 class="panel-title">${page} register</h2><p class="panel-subtitle">Sample records · updated just now</p></div><div class="table-tools"><input class="table-search" id="genericSearch" placeholder="Search ${page.toLowerCase()}..." aria-label="Search ${page}"></div></div><div class="table-scroll"><table class="generic-table"><thead><tr>${cfg.cols.map(c=>`<th>${c.toUpperCase()}</th>`).join("")}</tr></thead><tbody id="genericBody">${rows.map(r=>`<tr>${r.map((cell,i)=>`<td>${i===r.length-1&&["Riders","Hubs","Merchants","COD & finance"].includes(page)?statusPill(cell):page==="Settings"&&i===r.length-1?`<button class="button button-sm" data-toast="${r[0]} settings opened.">Manage</button>`:cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div><div style="padding:11px 16px;border-top:1px solid var(--line);color:#98a2ae;font-size:8px">Showing ${rows.length} sample records · Demo data</div></section>`}`;
    }
    function exceptionPanel(){const data=shipments.filter(s=>s.status==="Exception"||s.sla==="At risk"||s.status==="At hub");return `<div class="stats-mini"><div class="mini-card"><span>Open exceptions</span><strong>12</strong></div><div class="mini-card"><span>SLA at risk</span><strong>3</strong></div><div class="mini-card"><span>Awaiting action</span><strong>7</strong></div></div><section class="panel table-panel"><div class="panel-heading"><div><h2 class="panel-title">Exception work queue</h2><p class="panel-subtitle">Resolve blockers before the delivery promise expires.</p></div><input class="table-search" id="shipmentSearch" placeholder="Search exceptions..." aria-label="Search exceptions"></div>${shipmentRows(data)}<div class="empty-state">Review each exception and coordinate with the assigned rider or hub.</div></section>`}
    function render(page){document.getElementById("breadcrumbPage").textContent=page==="Overview"?"Live overview":page;document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("sidebar").classList.remove("open");const root=document.getElementById("mainContent");root.innerHTML=page==="Overview"?dashboard():page==="Dispatch"?dispatchPage():page==="E-commerce operations"||page==="Domestic & documents"?serviceOperationsPage(page):pageTable(page);attachTableSearch()}
    function dispatchPage(){return `<div class="page-heading"><div><p class="eyebrow">Network operations</p><h1>Dispatch & routes</h1><p class="subtitle">Assign unallocated shipments and balance rider workload across service zones.</p></div><div class="heading-actions"><button class="button" data-toast="Route plan refreshed.">↻ Rebalance routes</button><button class="button button-primary" data-action="assign">${icon("plus")} Assign shipment</button></div></div><div class="metrics">${metric("Unassigned shipments","18","box","4 urgent","ready at hub")}${metric("Riders available","28","users","across 4 zones","on shift")}${metric("Routes active","142","route","18 need review","network wide")}${metric("Avg. stops / rider","12.4","truck","within target","daily average")}</div><div class="dashboard-grid"><section class="panel"><div class="panel-heading"><div><h2 class="panel-title">Live dispatch map</h2><p class="panel-subtitle">Rider coverage and shipment assignments</p></div></div>${mapMarkup()}</section><section class="panel"><div class="panel-heading"><div><h2 class="panel-title">Assignment queue</h2><p class="panel-subtitle">Shipments waiting for a rider</p></div><span class="status status-warn">18 unassigned</span></div><div class="alert-list">${shipments.filter(s=>s.rider==="Unassigned").map(s=>`<div class="alert-item"><span class="alert-icon">${icon("box")}</span><div class="alert-copy"><strong>${s.id} · ${s.service}</strong>${s.destination}<small>${s.merchant} · ${s.created}</small></div><button class="button button-sm alert-action" data-assign-shipment="${s.id}">Assign</button></div>`).join("")}<div class="alert-item"><span class="alert-icon">${icon("box")}</span><div class="alert-copy"><strong>14 additional shipments</strong>Awaiting rider allocation at nearby hubs.<small>Across Dhaka North and Central</small></div><button class="button button-sm alert-action" data-action="assign">Assign</button></div></div></section></div><section class="panel table-panel"><div class="panel-heading"><div><h2 class="panel-title">Active route roster</h2><p class="panel-subtitle">Rider workloads and route health</p></div><button class="button button-sm" data-page-link="Riders">All riders</button></div><div class="table-scroll"><table><thead><tr><th>RIDER</th><th>SERVICE ZONE</th><th>ASSIGNED STOPS</th><th>COMPLETED</th><th>REMAINING</th><th>ROUTE HEALTH</th></tr></thead><tbody><tr><td>R-2048 · Jordan Rivera</td><td>Dhaka North</td><td>12</td><td>4</td><td>8</td><td>${statusPill("On track")}</td></tr><tr><td>R-2016 · Samira Khan</td><td>Dhaka Central</td><td>10</td><td>6</td><td>4</td><td>${statusPill("On track")}</td></tr><tr><td>R-2051 · Imran Hasan</td><td>Dhaka North</td><td>11</td><td>5</td><td>6</td><td>${statusPill("Issue")}</td></tr></tbody></table></div></section>`}
    let modalContext={};
    function openModal(kind,shipmentId){modalContext={kind,shipmentId};const title=document.getElementById("modalTitle"),desc=document.getElementById("modalDescription"),fields=document.getElementById("modalFields"),submit=document.getElementById("modalSubmit");
      if(kind==="assign"){title.textContent="Assign a shipment";desc.textContent="Select an unassigned shipment and an available rider.";submit.textContent="Confirm assignment";fields.innerHTML=`<div class="field full"><label for="assignShipment">Shipment</label><select id="assignShipment" required>${shipments.filter(s=>s.rider==="Unassigned").map(s=>`<option value="${s.id}" ${s.id===shipmentId?"selected":""}>${s.id} · ${s.destination}</option>`).join("")}<option value="PP-28512">PP-28512 · Farmgate, Dhaka</option></select></div><div class="field full"><label for="assignRider">Available rider</label><select id="assignRider" required><option>R-2029 · Ayesha Noor · Dhaka North</option><option>R-2030 · Tanvir Alam · Dhaka Central</option><option>R-2041 · Nabila Sultana · Dhaka North</option></select></div><div class="field full"><label for="assignPriority">Dispatch priority</label><select id="assignPriority"><option>Standard</option><option>Urgent · SLA at risk</option><option>Express document</option></select></div>`}
      else if(kind==="exception"){title.textContent=`Review exception · ${shipmentId}`;desc.textContent="Coordinate next steps and record an operations decision.";submit.textContent="Save resolution";fields.innerHTML=`<div class="field full"><label for="resolution">Resolution action</label><select id="resolution"><option>Schedule another delivery attempt</option><option>Return shipment to merchant</option><option>Route to nearest service hub</option><option>Contact recipient for address confirmation</option></select></div><div class="field full"><label for="resolutionNote">Internal note</label><textarea id="resolutionNote" placeholder="Add context for the rider or next shift"></textarea></div>`}
      else if(kind==="newShipment"||kind==="newEcommerce"||kind==="newDomestic"){const selectedCategory=kind==="newEcommerce"?"E-commerce":kind==="newDomestic"?"Domestic & documents":"";title.textContent=selectedCategory==="E-commerce"?"Create e-commerce shipment":selectedCategory==="Domestic & documents"?"Create domestic / document shipment":"Create shipment";desc.textContent=selectedCategory?`Create a shipment in the ${selectedCategory} service line.`:"Choose which service line will handle this shipment.";submit.textContent="Create shipment";fields.innerHTML=`<div class="field ${selectedCategory?"":"full"}"><label for="newCategory">Service line</label><select id="newCategory" ${selectedCategory?"disabled":""}><option ${selectedCategory==="E-commerce"?"selected":""}>E-commerce</option><option ${selectedCategory==="Domestic & documents"?"selected":""}>Domestic & documents</option></select></div><div class="field ${selectedCategory?"":"full"}"><label for="newMerchant">Merchant / account</label><select id="newMerchant"><option>Northstar Store</option><option>Craft & Co.</option><option>Papertrail Legal</option></select></div><div class="field full"><label for="newService">Service type</label><select id="newService">${selectedCategory==="E-commerce"?`<option>E-commerce parcel</option><option>Same-day parcel</option><option>Cash on delivery</option>`:selectedCategory==="Domestic & documents"?`<option>Document express</option><option>Domestic parcel</option>`:`<option>E-commerce parcel</option><option>Same-day parcel</option><option>Cash on delivery</option><option>Document express</option><option>Domestic parcel</option>`}</select></div><div class="field full"><label for="newRecipient">Recipient name</label><input id="newRecipient" required placeholder="Recipient name"></div><div class="field full"><label for="newDestination">Destination</label><input id="newDestination" required placeholder="Area, city"></div>`}
      else if(kind==="rider"){title.textContent="Add rider";desc.textContent="Invite a rider to join the courier network.";submit.textContent="Send rider invite";fields.innerHTML=`<div class="field"><label for="riderName">Rider name</label><input id="riderName" required placeholder="Full name"></div><div class="field"><label for="riderPhone">Phone number</label><input id="riderPhone" required placeholder="+880 1XXX-XXXXXX"></div><div class="field full"><label for="riderZone">Service zone</label><select id="riderZone"><option>Dhaka North</option><option>Dhaka Central</option><option>Dhaka South</option><option>Chattogram</option></select></div>`}
      else{title.textContent="Create dispatch";desc.textContent="Create a new dispatch batch for available riders.";submit.textContent="Create dispatch";fields.innerHTML=`<div class="field"><label for="dispatchHub">Origin hub</label><select id="dispatchHub"><option>Gulshan Sorting Hub</option><option>Motijheel Service Center</option><option>Dhanmondi Hub</option></select></div><div class="field"><label for="dispatchZone">Service zone</label><select id="dispatchZone"><option>Dhaka North</option><option>Dhaka Central</option><option>Dhaka South</option></select></div><div class="field full"><label for="dispatchNote">Dispatch note</label><textarea id="dispatchNote" placeholder="Optional route notes"></textarea></div>`}
      document.getElementById("modalBackdrop").classList.add("open")}
    function closeModal(){document.getElementById("modalBackdrop").classList.remove("open");modalContext={}}
    function attachTableSearch(){const search=document.getElementById("shipmentSearch");if(search)search.addEventListener("input",()=>{const q=search.value.toLowerCase();document.querySelectorAll("#shipmentBody tr").forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q))});const filter=document.getElementById("statusFilter");if(filter)filter.addEventListener("change",()=>document.querySelectorAll("#shipmentBody tr").forEach(row=>row.hidden=(filter.value&&!row.cells[4].textContent.includes(filter.value))||(search&&!row.textContent.toLowerCase().includes(search.value.toLowerCase()))));const generic=document.getElementById("genericSearch");if(generic)generic.addEventListener("input",()=>{const q=generic.value.toLowerCase();document.querySelectorAll("#genericBody tr").forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q))})}
    function showToast(text){const toast=document.getElementById("toast");toast.textContent=text;toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove("show"),2600)}
    function exportCurrentData(){const page=document.getElementById("breadcrumbPage").textContent;let headers,rows,fileName;const shipmentHeaders=["Tracking ID","Service line","Merchant","Recipient","Destination","Service","Created","Rider","Status","SLA"];const toShipmentRow=s=>[s.id,serviceCategory(s),s.merchant,s.recipient,s.destination,s.service,s.created,s.rider,s.status,s.sla];if(page==="Live overview"||page==="Shipments"){headers=shipmentHeaders;rows=shipments.map(toShipmentRow);fileName="shipments"}else if(page==="E-commerce operations"||page==="Domestic & documents"){const category=page==="E-commerce operations"?"E-commerce":"Domestic & documents";headers=shipmentHeaders;rows=shipments.filter(s=>serviceCategory(s)===category).map(toShipmentRow);fileName=category.toLowerCase().replaceAll(" ","-").replaceAll("&","and")}else if(page==="Exceptions"){headers=shipmentHeaders;rows=shipments.filter(s=>s.status==="Exception"||s.sla==="At risk"||s.status==="At hub").map(toShipmentRow);fileName="exceptions"}else if(genericPages[page]&&genericPages[page].cols){headers=genericPages[page].cols;rows=genericPages[page].rows;fileName=page.toLowerCase().replaceAll(" ","-").replaceAll("&","and")}else{showToast("There is no export data for this view.");return}const csv=[headers,...rows].map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`delivery-fast-${fileName}.csv`;a.click();URL.revokeObjectURL(a.href);showToast(`${page} data exported as CSV.`)}
    document.getElementById("navigation").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)render(b.dataset.page)});
    document.getElementById("mainContent").addEventListener("click",e=>{const page=e.target.closest("[data-page-link]");if(page){render(page.dataset.pageLink);return}const toast=e.target.closest("[data-toast]");if(toast){showToast(toast.dataset.toast);return}const assignShipment=e.target.closest("[data-assign-shipment]");if(assignShipment){openModal("assign",assignShipment.dataset.assignShipment);return}const exception=e.target.closest("[data-exception]");if(exception){openModal("exception",exception.dataset.exception);return}const action=e.target.closest("[data-action]");if(action){const a=action.dataset.action;if(a==="export"){exportCurrentData();return}if(["assign","rider","dispatch","newShipment"].includes(a)){openModal(a==="assign"?"assign":a==="rider"?"rider":a==="dispatch"?"dispatch":"newShipment");return}}const detail=e.target.closest("[data-track]");if(detail){const shipment=shipments.find(s=>s.id===detail.dataset.track);showToast(shipment?`${shipment.id}: ${shipment.status} · ${shipment.destination}`:"Shipment details unavailable.");return}});
    document.getElementById("mainContent").addEventListener("click",e=>{const action=e.target.closest('[data-action="newEcommerce"],[data-action="newDomestic"]');if(action)openModal(action.dataset.action)});
    document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){const q=e.currentTarget.value.trim().toLowerCase();if(!q)return;const hit=shipments.find(s=>s.id.toLowerCase()===q||s.recipient.toLowerCase().includes(q));if(hit){render("Shipments");const search=document.getElementById("shipmentSearch");if(search){search.value=hit.id;search.dispatchEvent(new Event("input"))}showToast(`${hit.id} · ${hit.status} · ${hit.destination}`)}else showToast(`No sample shipment found for “${e.currentTarget.value.trim()}”.`)}});
    document.getElementById("notifications").addEventListener("click",()=>showToast("You have 4 operations alerts requiring attention."));
    document.getElementById("companySwitch").addEventListener("click",()=>showToast("Delivery Fast · operations console."));
    document.querySelector(".support-card button").addEventListener("click",e=>showToast(e.currentTarget.dataset.toast));
    document.getElementById("mobileMenu").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
    document.getElementById("modalClose").addEventListener("click",closeModal);document.getElementById("modalCancel").addEventListener("click",closeModal);document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
    document.getElementById("modalForm").addEventListener("submit",e=>{if(!["newEcommerce","newDomestic"].includes(modalContext.kind))return;e.preventDefault();e.stopImmediatePropagation();const kind=modalContext.kind;const service=document.getElementById("newService").value;const name=document.getElementById("newRecipient").value.trim();const category=kind==="newEcommerce"?"E-commerce":"Domestic & documents";const nextId=`PP-${28510+shipments.length}`;shipments.unshift({id:nextId,merchant:document.getElementById("newMerchant").value,recipient:name,destination:document.getElementById("newDestination").value.trim(),service,created:"Just now",rider:"Unassigned",status:"At hub",sla:"Assign now"});closeModal();render(category==="E-commerce"?"E-commerce operations":"Domestic & documents");showToast(`${category} shipment ${nextId} created.`)},true);
    document.getElementById("modalForm").addEventListener("submit",e=>{e.preventDefault();const kind=modalContext.kind;const id=modalContext.shipmentId;if(kind==="assign"){const shipmentId=document.getElementById("assignShipment").value;const rider=document.getElementById("assignRider").value;const row=shipments.find(s=>s.id===shipmentId);if(row){row.rider=rider.split(" · ").slice(0,2).join(" · ");row.status="Assigned";row.sla="On track"}closeModal();render(document.getElementById("breadcrumbPage").textContent==="Live overview"?"Overview":document.getElementById("breadcrumbPage").textContent);showToast(`${shipmentId} assigned to ${rider.split(" · ")[0]}.`)}else if(kind==="exception"){const resolution=document.getElementById("resolution").value;const row=shipments.find(s=>s.id===id);if(row){row.status=resolution.includes("Return")?"Return scheduled":"Reattempt scheduled";row.sla="On track"}closeModal();render("Exceptions");showToast(`${id}: ${resolution.toLowerCase()} recorded.`)}else if(kind==="newShipment"){const name=document.getElementById("newRecipient").value.trim();const nextId=`PP-${28510+shipments.length}`;shipments.unshift({id:nextId,merchant:document.getElementById("newMerchant").value,recipient:name,destination:document.getElementById("newDestination").value.trim(),service:document.getElementById("newService").value,created:"Just now",rider:"Unassigned",status:"At hub",sla:"Assign now"});closeModal();render("Shipments");showToast(`Shipment ${nextId} created.`)}else if(kind==="rider"){const name=document.getElementById("riderName").value.trim();closeModal();showToast(`Rider invitation prepared for ${name}.`)}else{closeModal();showToast("Dispatch batch created for the selected zone.")}});
    render("Overview");
  </script>
</body>
</html>
